<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#444">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="500" height="400" fill="#ffffff"/>

  <!-- Box 1 -->
  <rect x="30" y="20" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">1. Business</text>
  <text x="120" y="75" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Understanding</text>

  <!-- Arrow 1→2 -->
  <line x1="120" y1="100" x2="120" y2="130" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Box 2 -->
  <rect x="30" y="135" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="120" y="170" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">2. Data</text>
  <text x="120" y="190" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Acquisition</text>

  <!-- Arrow 2→3 -->
  <line x1="120" y1="215" x2="120" y2="245" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Box 3 -->
  <rect x="30" y="250" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="120" y="285" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">3. Data Preparation</text>
  <text x="120" y="305" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">&amp; Management</text>

  <!-- Arrow 3→4 horizontal -->
  <line x1="210" y1="290" x2="285" y2="290" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Box 4 -->
  <rect x="290" y="250" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="285" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">4. Modeling</text>
  <text x="380" y="305" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">&amp; Analytics</text>

  <!-- Arrow 4→5 -->
  <line x1="380" y1="250" x2="380" y2="220" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Box 5 -->
  <rect x="290" y="135" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="170" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">5. Evaluation</text>
  <text x="380" y="190" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">&amp; Insight</text>

  <!-- Arrow 5→6 -->
  <line x1="380" y1="135" x2="380" y2="105" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Box 6 -->
  <rect x="290" y="20" width="180" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="380" y="55" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">6. Deployment &amp;</text>
  <text x="380" y="75" text-anchor="middle" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Business Value</text>
</svg>